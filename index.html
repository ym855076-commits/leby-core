<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEYLI // Ultimate Neural Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg-base: #07090e;
            --neon-blue: #00f0ff;
            --neon-red: #ff0055;
            --glass-surface: rgba(13, 17, 23, 0.92);
            --glass-border: rgba(0, 240, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow-x: hidden;
        }

        .cyber-wrapper {
            width: 100%;
            max-width: 380px;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Шапка с аватаром */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .avatar-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info {
            flex: 1;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .header h1 span {
            color: var(--neon-blue);
        }

        .header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            color: #64748b;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        /* Видеоплеер */
        .video-container {
            width: 100%;
            height: 125px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Чат */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 95px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chat-container::-webkit-scrollbar {
            width: 2px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
        }

        .message {
            font-size: 9.5px;
            padding: 5px 7px;
            border-radius: 6px;
            line-height: 1.3;
        }

        .message.bot {
            background: rgba(0, 240, 255, 0.07);
            border-left: 2px solid var(--neon-blue);
            color: #93c5fd;
            font-family: 'JetBrains Mono', monospace;
        }

        .message.user {
            background: rgba(255, 0, 85, 0.08);
            border-right: 2px solid var(--neon-red);
            color: #fca5a5;
            align-self: flex-end;
            max-width: 90%;
        }

        /* Поле ввода */
        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 5px 8px;
            color: #fff;
            font-size: 9.5px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--neon-blue);
        }

        .input-group button {
            background: linear-gradient(135deg, var(--neon-blue), #0088ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            padding: 0 10px;
            font-size: 9.5px;
            cursor: pointer;
        }

        /* Кнопки связи */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 9.5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .btn-phone {
            background: linear-gradient(90deg, #0055ff, var(--neon-blue));
            color: #fff;
        }

        .btn-tg {
            background: linear-gradient(90deg, #ff0055, #ff5500);
            color: #fff;
        }

        /* Системные спеки */
        .sys-specs {
            display: flex;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 7.5px;
            color: #64748b;
        }

        .sys-specs span {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="cyber-wrapper">
        <!-- Шапка с динамическим аватаром -->
        <div class="header">
            <div class="avatar-box">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop" alt="LEYLI Avatar">
            </div>
            <div class="header-info">
                <h1>LEYLI <span>// V.15</span></h1>
                <p>AI COMPANION & MEDIA HUB</p>
            </div>
        </div>

        <!-- Видеоплеер (Плейлист / Клипы) -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLrEnWh7k72wq78t2O1rF57jU95r81c3yC" allowfullscreen></iframe>
        </div>

        <!-- Интерактивный чат -->
        <div class="chat-container" id="chatBox">
            <div class="message bot">> Система активирована. Включай медиа-поток вверху, оценивай атмосферу и общайся со мной!</div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Задай вопрос системе...">
            <button onclick="handleUserMessage()">Ввод</button>
        </div>

        <!-- Кнопки связи -->
        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        <div class="actions">
            <a href="tel:+99363778188" class="btn-link btn-phone">
                📞 Прямая линия: +993 63778188
            </a>
            <a href="https://t.me/" target="_blank" class="btn-link btn-tg">
                ⚡ Secure Telegram Канал
            </a>
        </div>

        <div class="sys-specs">
            <div>Локация: <span>Туркменабат</span></div>
            <div>Статус: <span>Онлайн</span></div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleUserMessage();
        });

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            setTimeout(() => {
                const reply = getSmartReply(text);
                appendMessage(reply, 'bot');
            }, 400);
        }

        function appendMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getSmartReply(q) {
            q = q.toLowerCase();
            if (q.includes('погод')) return "> Прогноз в Туркменабате: отличный день для реализации масштабных идей и творчества! ☀️";
            if (q.includes('привет') || q.includes('салам')) return "> Салам! Добро пожаловать в моё цифровое пространство. Рада нашему знакомству.";
            if (q.includes('музык') || q.includes('клип') || q.includes('трек') || q.includes('видео')) return "> Медиа-модуль транслирует эксклюзивный контент. Наслаждайся звуком и атмосферой! 🎧";
            if (q.includes('анекдот') || q.includes('шутк')) return "> Как говорят в цифровом мире: хорошего кода много не бывает! 😉";
            if (q.includes('номер') || q.includes('связь') || q.includes('телефон')) return "> Прямая линия доступна по синей кнопке: +993 63778188.";
            return `> Запрос "${q}" успешно обработан. Включай медиа вверху и двигайся к своим целям!`;
        }
    </script>
</body>
</html>
