<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEYLI // Ultimate Neural Portal V.26</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg-base: #05070a;
            --neon-blue: #00f0ff;
            --neon-red: #ff0055;
            --neon-green: #00ff66;
            --glass-surface: rgba(10, 14, 20, 0.98);
            --glass-border: rgba(0, 240, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
            margin: 0;
            width: 100vw;
            overflow-x: hidden;
        }

        .cyber-wrapper {
            width: 100%;
            min-height: 100vh;
            background: var(--glass-surface);
            border: none;
            border-radius: 0;
            padding: 14px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 10px;
        }

        .avatar-box {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info {
            flex: 1;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .header h1 span {
            color: var(--neon-blue);
        }

        .header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8.5px;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        /* Виджет погоды */
        .weather-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #93c5fd;
        }

        .weather-widget span {
            color: #fff;
            font-weight: 600;
        }

        /* Видеоплеер YouTube (крупный) */
        .video-container {
            width: 100%;
            height: 210px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Быстрые подсказки */
        .quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .quick-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 11px;
            color: #cbd5e1;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        /* Чат */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
        }

        .message {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .message.bot {
            background: rgba(0, 240, 255, 0.09);
            border-left: 3px solid var(--neon-blue);
            color: #93c5fd;
            font-family: 'JetBrains Mono', monospace;
        }

        .message.user {
            background: rgba(255, 0, 85, 0.1);
            border-right: 3px solid var(--neon-red);
            color: #fca5a5;
            align-self: flex-end;
            max-width: 90%;
        }

        .tts-btn {
            background: none;
            border: none;
            color: var(--neon-blue);
            font-size: 11px;
            cursor: pointer;
            margin-left: 6px;
        }

        /* Поле ввода + Микрофон */
        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--neon-blue);
        }

        .mic-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 8px;
            color: #fff;
            padding: 0 14px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mic-btn.listening {
            background: var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: 0 0 12px var(--neon-red);
        }

        .input-group button.send-btn {
            background: linear-gradient(135deg, var(--neon-blue), #0077ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            padding: 0 18px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Блок монетизации */
        .promo-box {
            background: linear-gradient(90deg, rgba(0, 255, 102, 0.08), rgba(0, 240, 255, 0.08));
            border: 1px dashed rgba(0, 255, 102, 0.4);
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            font-size: 10px;
            color: #a7f3d0;
        }

        .promo-box a {
            color: var(--neon-green);
            text-decoration: none;
            font-weight: 700;
        }

        /* Кнопки связи */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-link {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-phone {
            background: linear-gradient(90deg, #0044cc, var(--neon-blue));
            color: #fff;
        }

        .btn-tg {
            background: linear-gradient(90deg, #ff0055, #ff4400);
            color: #fff;
        }

        /* Системные спеки */
        .sys-specs {
            display: flex;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #94a3b8;
        }

        .sys-specs span {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="cyber-wrapper">
        <!-- Шапка -->
        <div class="header">
            <div class="avatar-box">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop" alt="LEYLI">
            </div>
            <div class="header-info">
                <h1>LEYLI <span>// V.26 MAXIMUS</span></h1>
                <p>NEURAL VOICE & MONETIZATION HUB</p>
            </div>
        </div>

        <!-- Виджет погоды -->
        <div class="weather-widget">
            <span>📍 Туркменабад</span>
            <span>☀️ +31°C (Онлайн)</span>
        </div>

        <!-- Видеоплеер YouTube -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/9bZkp7q19f0" allowfullscreen></iframe>
        </div>

        <!-- Быстрые чипсы-подсказки -->
        <div class="quick-chips">
            <div class="chip" onclick="setQuery('Как заработать в интернете?')">💰 Заработок</div>
            <div class="chip" onclick="setQuery('Какая погода завтра?')">🌤 Погода</div>
            <div class="chip" onclick="setQuery('Напиши код сайта')">💻 Код</div>
            <div class="chip" onclick="setQuery('Сделай сценарий для TikTok')">🎬 TikTok</div>
        </div>

        <!-- Чат -->
        <div class="chat-container" id="chatBox">
            <div class="message bot">> Привет! Я LEYLI V.26. Теперь я растянута на полный экран смартфона!</div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Спроси голосом или текстом...">
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="Голосовой ввод">🎤</button>
            <button class="send-btn" onclick="handleUserMessage()">Ввод</button>
        </div>

        <!-- Блок монетизации -->
        <div class="promo-box">
            🚀 Хотите такой же ИИ-проект? <a href="tel:+99363778188">Заказать рекламу</a>
        </div>

        <!-- Кнопки связи -->
        <div class="actions">
            <a href="tel:+99363778188" class="btn-link btn-phone">📞 Связь</a>
            <a href="https://t.me/" target="_blank" class="btn-link btn-tg">⚡ Telegram</a>
        </div>

        <div class="sys-specs">
            <div>Масштаб: <span>100% Screen</span></div>
            <div>Статус: <span>Активен</span></div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleUserMessage();
        });

        function setQuery(text) {
            userInput.value = text;
            handleUserMessage();
        }

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Голосовой ввод не поддерживается вашим браузером.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                userInput.placeholder = "Слушаю вас...";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                micBtn.classList.remove('listening');
                userInput.placeholder = "Спроси голосом или текстом...";
                handleUserMessage();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                userInput.placeholder = "Спроси голосом или текстом...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                userInput.placeholder = "Спроси голосом или текстом...";
            };

            recognition.start();
        }

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            setTimeout(() => {
                const replyText = "> Перенаправляю ваш запрос к главному ИИ для точного ответа...";
                appendMessage(replyText, 'bot', true);
                
                setTimeout(() => {
                    const encodedQuery = encodeURIComponent(text);
                    window.location.href = `https://www.google.com/search?q=${encodedQuery}`;
                }, 1200);

            }, 400);
        }

        function appendMessage(text, sender, speak = false) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            
            if (speak && 'speechSynthesis' in window) {
                const btn = document.createElement('button');
                btn.className = 'tts-btn';
                btn.innerHTML = '🔊';
                btn.onclick = () => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ru-RU';
                    window.speechSynthesis.speak(utterance);
                };
                msg.appendChild(btn);
            }

            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
