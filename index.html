<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEYLI // Ultimate Neural Portal V.23</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg-base: #07090e;
            --neon-blue: #00f0ff;
            --neon-red: #ff0055;
            --glass-surface: rgba(13, 17, 23, 0.94);
            --glass-border: rgba(0, 240, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow-x: hidden;
        }

        .cyber-wrapper {
            width: 100%;
            max-width: 390px;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.07);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Шапка с аватаром кибер-девушки */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
        }

        .avatar-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            flex-shrink: 0;
            position: relative;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-info {
            flex: 1;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .header h1 span {
            color: var(--neon-blue);
        }

        .header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            color: #64748b;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        /* Интерактивный мини-виджет (Погода) */
        .weather-widget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 6px;
            padding: 4px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            color: #93c5fd;
        }

        .weather-widget span {
            color: #fff;
            font-weight: 600;
        }

        /* Видеоплеер YouTube */
        .video-container {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Чат */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 90px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chat-container::-webkit-scrollbar {
            width: 2px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
        }

        .message {
            font-size: 9.5px;
            padding: 5px 7px;
            border-radius: 6px;
            line-height: 1.3;
            position: relative;
        }

        .message.bot {
            background: rgba(0, 240, 255, 0.07);
            border-left: 2px solid var(--neon-blue);
            color: #93c5fd;
            font-family: 'JetBrains Mono', monospace;
        }

        .message.user {
            background: rgba(255, 0, 85, 0.08);
            border-right: 2px solid var(--neon-red);
            color: #fca5a5;
            align-self: flex-end;
            max-width: 90%;
        }

        .tts-btn {
            background: none;
            border: none;
            color: var(--neon-blue);
            font-size: 9px;
            cursor: pointer;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Поле ввода */
        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 5px 8px;
            color: #fff;
            font-size: 9.5px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--neon-blue);
        }

        .input-group button {
            background: linear-gradient(135deg, var(--neon-blue), #0088ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            padding: 0 10px;
            font-size: 9.5px;
            cursor: pointer;
        }

        /* Кнопки связи */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 9.5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .btn-phone {
            background: linear-gradient(90deg, #0055ff, var(--neon-blue));
            color: #fff;
        }

        .btn-tg {
            background: linear-gradient(90deg, #ff0055, #ff5500);
            color: #fff;
        }

        /* Системные спеки */
        .sys-specs {
            display: flex;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 7.5px;
            color: #64748b;
        }

        .sys-specs span {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="cyber-wrapper">
        <!-- Шапка с аватаром кибер-девушки -->
        <div class="header">
            <div class="avatar-box">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=250&auto=format&fit=crop" alt="LEYLI Cyber Girl">
            </div>
            <div class="header-info">
                <h1>LEYLI <span>// V.23 ULTIMATE</span></h1>
                <p>NEURAL AGENT & VOICE HUB</p>
            </div>
        </div>

        <!-- Виджет погоды в Туркменабаде -->
        <div class="weather-widget">
            <span>📍 Туркменабад</span>
            <span>☀️ +31°C (Ясно)</span>
        </div>

        <!-- Видеоплеер YouTube -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/9bZkp7q19f0" allowfullscreen></iframe>
        </div>

        <!-- Интерактивный чат -->
        <div class="chat-container" id="chatBox">
            <div class="message bot">> Привет! Я LEYLI V.23. Снабжена голосовым синтезом и связью с главным ИИ!</div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Спроси агента или дай задачу...">
            <button onclick="handleUserMessage()">Ввод</button>
        </div>

        <!-- Кнопки связи -->
        <div class="actions">
            <a href="tel:+99363778188" class="btn-link btn-phone">
                📞 Прямая линия: +993 63778188
            </a>
            <a href="https://t.me/" target="_blank" class="btn-link btn-tg">
                ⚡ Secure Telegram Канал
            </a>
        </div>

        <div class="sys-specs">
            <div>Ядро: <span>Активно</span></div>
            <div>Статус: <span>Онлайн</span></div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleUserMessage();
        });

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            // Речевой ответ агента + перенаправление
            setTimeout(() => {
                const replyText = "> Перенаправляю ваш запрос к главному ИИ для точного расчета...";
                appendMessage(replyText, 'bot', true);
                
                setTimeout(() => {
                    const encodedQuery = encodeURIComponent(text);
                    window.location.href = `https://www.google.com/search?q=${encodedQuery}`;
                }, 1200);

            }, 400);
        }

        function appendMessage(text, sender, speak = false) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.innerText = text;
            
            if (speak && 'speechSynthesis' in window) {
                const btn = document.createElement('button');
                btn.className = 'tts-btn';
                btn.innerHTML = '🔊 озвучить';
                btn.onclick = () => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ru-RU';
                    window.speechSynthesis.speak(utterance);
                };
                msg.appendChild(btn);
            }

            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
