<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE // Ultimate Neural Interface 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

        :root {
            --bg-base: #010308;
            --neon-blue: #00f0ff;
            --neon-red: #ff0055;
            --glass-surface: rgba(8, 12, 22, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 15px;
        }

        /* Эффект легкой сканирующей линии по экрану */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.3;
        }

        .ambient-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.35;
            animation: drift 10s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: var(--neon-blue);
            top: -200px;
            left: -200px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: var(--neon-red);
            bottom: -200px;
            right: -200px;
            animation-delay: -5s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 60px) scale(1.2); }
        }

        .cyber-wrapper {
            width: 100%;
            max-width: 500px;
            background: var(--glass-surface);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9),
                        0 0 50px rgba(0, 240, 255, 0.15),
                        inset 0 0 30px rgba(255, 0, 85, 0.08);
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .visual-display {
            position: relative;
            width: 100%;
            height: 320px;
            background: #000;
        }

        .visual-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            content: url('https://images.unsplash.com/photo-1563245372-f21724e3856d?q=80&w=900&auto=format&fit=crop');
            filter: contrast(130%) saturate(140%);
        }

        .visual-display::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(8, 12, 22, 1), transparent);
        }

        .status-pill {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(2, 4, 10, 0.9);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 3;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-red);
            animation: blinking 1.2s infinite;
        }

        @keyframes blinking {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .info-section {
            padding: 0 26px 24px 26px;
            margin-top: -30px;
            position: relative;
            z-index: 2;
        }

        .core-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .core-title span {
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .core-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        /* ПРОДВИНУТЫЙ ТЕРМИНАЛ-ЧАТ */
        .chat-module {
            background: rgba(2, 6, 15, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .chat-history {
            height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding-right: 6px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.4);
            border-radius: 4px;
        }

        .msg {
            padding: 9px 12px;
            border-radius: 10px;
            line-height: 1.4;
            max-width: 92%;
            animation: fadeInMsg 0.3s ease;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.ai {
            background: rgba(0, 240, 255, 0.08);
            color: #38bdf8;
            border-left: 3px solid var(--neon-blue);
            align-self: flex-start;
        }

        .msg.user {
            background: rgba(255, 0, 85, 0.08);
            color: #f43f5e;
            border-right: 3px solid var(--neon-red);
            align-self: flex-end;
            text-align: right;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }

        .chat-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .send-btn {
            background: var(--neon-blue);
            color: #010308;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .send-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-cyber {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary-blue {
            background: linear-gradient(135deg, #0055ff, var(--neon-blue));
            color: #010308;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
        }

        .btn-primary-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 240, 255, 0.5);
        }

        .btn-outline-red {
            background: rgba(255, 0, 85, 0.05);
            color: var(--neon-red);
            border: 1.5px solid var(--neon-red);
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.15);
        }

        .btn-outline-red:hover {
            background: rgba(255, 0, 85, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.3);
        }

        .sys-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #64748b;
        }

        .sys-specs div span {
            color: #e2e8f0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="ambient-layer">
        <div class="orb orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <div class="cyber-wrapper">
        <div class="visual-display">
            <div class="status-pill">
                <div class="pulse-dot"></div> QUANTUM_LINK
            </div>
            <img src="" alt="AI Core Interface">
        </div>

        <div class="info-section">
            <h1 class="core-title">LEYLI <span>// V.09</span></h1>
            <div class="core-subtitle">Autonomous Neural Companion</div>

            <!-- ИНТЕРАКТИВНЫЙ ТЕРМИНАЛ -->
            <div class="chat-module">
                <div class="chat-history" id="chatHistory">
                    <div class="msg ai">&gt; Квантовый узел активирован. Напишите сообщение для теста системы.</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="userInput" class="chat-input" placeholder="Спросите систему о чем угодно..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">Связь</button>
                </div>
            </div>

            <!-- КНОПКИ СВЯЗИ -->
            <div class="action-stack">
                <a href="tel:+99363778188" class="btn-cyber btn-primary-blue" onclick="playClick()">
                    📞 Прямая линия: +993 63778188
                </a>
                <a href="https://t.me/LebapTechnoHub" class="btn-cyber btn-outline-red" onclick="playClick()">
                    ⚡ Secure Telegram Канал
                </a>
            </div>

            <div class="sys-specs">
                <div>Регион: <span>Türkmenabat Core</span></div>
                <div>Защита: <span>End-to-End AI</span></div>
                <div>Статус: <span>Максимум</span></div>
                <div>Пакет: <span>VIP 2026</span></div>
            </div>
        </div>
    </div>

    <script>
        // Интеллектуальный генератор ответов под контекст
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Встроенный синтезатор звука кибер-клика (работает без внешних файлов)
        function playClick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function getSmartResponse(input) {
            const text = input.toLowerCase();
            if (text.includes('привет') || text.includes('салам') || text.includes('здарова')) {
                return "Приветствую! Квантовый узел на связи. Чем могу помочь?";
            } else if (text.includes('кто ты') || text.includes('что ты')) {
                return "Я автономный нейро-ассистент проекта 2026 года.";
            } else if (text.includes('цена') || text.includes('сколько') || text.includes('купить')) {
                return "Для обсуждения коммерческих условий и заказов используйте прямую связь: +993 63778188.";
            } else if (text.includes('лебап') || text.includes('туркменабат')) {
                return "Системы Лебапа работают стабильно. Передача данных защищена.";
            } else {
                const smartVariants = [
                    "Анализирую ваш запрос... Параметры в норме.",
                    "Интересная мысль. Нейросеть фиксирует данные.",
                    "Связь стабильна. Ожидаю дальнейших инструкций.",
                    "Это уровень высоких технологий. Подробности через оператора."
                ];
                return smartVariants[Math.floor(Math.random() * smartVariants.length)];
            }
        }

        function handleSend() {
            playClick();
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            setTimeout(() => {
                const reply = getSmartResponse(text);
                addMessage(`> ${reply}`, 'ai');
            }, 500);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
